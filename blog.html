<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog — aafnotech</title>
  <meta name="description" content="Read articles about web development, SEO, and digital solutions for Nepali businesses. Tips and insights from aafnotech." />
  <meta name="keywords" content="blog, web development tips, SEO, digital marketing" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://aafnopathshala.com/blog.html" />
  <style>
    :root{
      --bg:#f7f7f4;
      --surface:#fff;
      --muted:#666;
      --text:#111;
      --accent:#6cab2f;
      --border:rgba(0,0,0,0.08);
      --nav-height:70px;
      --max-width:1100px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;display:flex;flex-direction:column;min-height:100%}

    nav{position:sticky;top:0;z-index:120;display:flex;align-items:center;justify-content:space-between;padding:.9rem 5%;min-height:var(--nav-height);background:var(--surface);border-bottom:1px solid var(--border)}
    .logo{font-weight:800;color:var(--text);text-decoration:none;font-size:1.05rem;letter-spacing:.02em}
    .nav-links{display:flex;gap:1.15rem;list-style:none;align-items:center;flex-wrap:wrap}
    .nav-links a{color:var(--muted);text-decoration:none;font-weight:600;position:relative;padding:.15rem 0;transition:color .18s}
    .nav-links a::after{content:'';position:absolute;left:0;right:0;height:2px;background:var(--accent);bottom:-6px;transform:scaleX(0);transform-origin:left;transition:transform .22s}
    .nav-links a:hover{color:var(--text)}
    .nav-links a:hover::after{transform:scaleX(1)}
    .nav-links a[aria-current="page"]{color:var(--text)}
    .nav-links a[aria-current="page"]::after{transform:scaleX(1)}
    .dropdown{position:relative}
    .dropdown-toggle{display:inline-flex;align-items:center;gap:.3rem;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer}
    .dropdown-toggle::after{content:'▾';font-size:.72rem;line-height:1;transform:translateY(-1px)}
    .dropdown-menu{position:absolute;top:100%;right:0;min-width:180px;list-style:none;padding:.4rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.08);display:none}
    .dropdown-menu li a{display:block;padding:.45rem .55rem;border-radius:6px}
    .dropdown-menu li a::after{display:none}
    .dropdown:hover .dropdown-menu,
    .dropdown:focus-within .dropdown-menu{display:block}

    main{margin-top:0;flex:1}
    .section{padding:3rem 5%;border-bottom:1px solid rgba(0,0,0,.03)}
    .section--hero{display:flex;align-items:center;min-height:35vh;padding-top:1rem;padding-bottom:1rem}
    .wrap{max-width:var(--max-width);margin:0 auto}
    .eyebrow{font-size:.8rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.35rem}
    h1{font-family:Georgia,serif;font-size:2.4rem;margin:0 0 .5rem 0;line-height:1.2}
    .lead{color:var(--muted);max-width:760px;margin:0;line-height:1.7}

    .posts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem;margin-top:2.5rem}
    .post-card{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:2rem;transition:all .2s;text-decoration:none;display:flex;flex-direction:column;position:relative;overflow:hidden}
    .post-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),rgba(108,171,47,.3));opacity:0;transition:opacity .2s}
    .post-card:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(108,171,47,.08);text-decoration:none}
    .post-card:hover::before{opacity:1}
    .post-card:hover .post-title{color:var(--accent)}
    .post-meta{font-size:.74rem;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem}
    .post-title{font-family:Georgia,serif;font-size:1.4rem;margin-bottom:.6rem;color:var(--text);transition:color .2s}
    .post-excerpt{color:var(--muted);margin-bottom:1.2rem;line-height:1.7;flex-grow:1}
    .post-footer{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--border);font-size:.85rem}
    .post-author{color:var(--muted);font-weight:600}
    .post-time{color:var(--accent);font-weight:600}

    footer{padding:1.5rem 5%;text-align:center;border-top:1px solid var(--border);color:var(--muted)}
    footer a{color:var(--text);text-decoration:none;font-weight:600}

    @media (max-width:900px){
      :root{--nav-height:64px}
      nav{padding:.8rem 4%}
      .nav-links{gap:.9rem}
      .logo{font-size:.98rem}
      .nav-links a{font-size:.88rem}
      .dropdown-menu{right:auto;left:0}
      .posts-grid{grid-template-columns:1fr;gap:1.5rem}
      .section{padding:2.5rem 4%}
      h1{font-size:2rem}
      .post-card{padding:1.5rem}
      .post-title{font-size:1.2rem}
    }

    @media (max-width:600px){
      :root{--nav-height:92px}
      nav{flex-direction:column;align-items:flex-start;gap:.45rem;padding:.7rem 4%}
      .logo{font-size:.95rem}
      .nav-links{width:100%;gap:.9rem;flex-wrap:wrap}
      .nav-links a{font-size:.83rem}
      .dropdown-menu{position:static;display:block;box-shadow:none;border:none;padding:.2rem 0 0 .5rem}
      .dropdown-toggle::after{display:none}
      .section{padding:2rem 4%}
      h1{font-size:1.8rem}
      .posts-grid{gap:1.2rem}
      .post-card{padding:1.25rem}
      .post-title{font-size:1.1rem}
    }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">aafnotech</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#services">Services</a></li>
      <li><a href="portfolio.html">Portfolios</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="blog.html" aria-current="page">Blog</a></li>
      <li class="dropdown">
        <a class="dropdown-toggle" href="#" aria-label="Elements menu">Elements</a>
        <ul class="dropdown-menu">
          <li><a href="faq.html">FAQ</a></li>
          <li><a href="privacy-policy.html">Privacy Policy</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <main>
    <section class="section section--hero">
      <div class="wrap">
        <div class="eyebrow">Blog</div>
        <h1>Latest Articles & Insights</h1>
        <p class="lead">Tips on web development, SEO, and digital strategies for growing your business in Nepal.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="posts-grid" id="posts-container">
          <!-- Posts will be loaded here by JavaScript -->
        </div>
      </div>
    </section>
  </main>

  <footer>
    © 2026 aafnotech · <a href="index.html">Back to home</a>
  </footer>

  <script>
    // Load and display blog posts
    async function loadBlogs() {
      try {
        const response = await fetch('blogs.json');
        const blogs = await response.json();
        const container = document.getElementById('posts-container');
        
        // Sort by date (newest first)
        blogs.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        container.innerHTML = blogs.map(blog => `
          <a href="blog-post.html?id=${blog.id}" class="post-card">
            <div class="post-meta">${blog.category}</div>
            <h2 class="post-title">${blog.title}</h2>
            <p class="post-excerpt">${blog.excerpt}</p>
            <div class="post-footer">
              <span class="post-author">${blog.author}</span>
              <span class="post-time">${blog.readTime}</span>
            </div>
          </a>
        `).join('');
      } catch (error) {
        console.error('Error loading blogs:', error);
        document.getElementById('posts-container').innerHTML = '<p>Error loading blog posts.</p>';
      }
    }
    
    loadBlogs();
  </script>
</body>
</html>
