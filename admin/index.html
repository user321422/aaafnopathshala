<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>aafnotech Blog Admin</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#f7f7f4;color:#111;padding:24px}
    .card{background:#fff;border-radius:10px;padding:16px;border:1px solid rgba(0,0,0,.06);max-width:1100px;margin:12px auto}
    h1{font-family:Georgia,serif}
    label{display:block;margin:8px 0 4px;font-weight:700}
    input,textarea,select{width:100%;padding:8px;border:1px solid rgba(0,0,0,.08);border-radius:6px}
    .grid-2{display:grid;grid-template-columns:1fr 360px;gap:18px}
    .btn{display:inline-block;padding:8px 12px;background:#6cab2f;color:#fff;border-radius:8px;text-decoration:none;border:0;cursor:pointer}
    .btn.ghost{background:transparent;color:#6cab2f;border:1px solid rgba(108,171,47,.12)}
    .list{margin-top:12px}
    .post-item{padding:10px;border-bottom:1px solid rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center}
    .meta{font-size:.85rem;color:#666}
    .controls{display:flex;gap:6px}
    .input-inline{display:flex;gap:8px}
    .small{font-size:.85rem;color:#666}
    .preview{background:#fafafa;border:1px solid rgba(0,0,0,.04);padding:12px;border-radius:8px;margin-top:10px;max-height:420px;overflow:auto}
    .preview h2{font-family:Georgia,serif;margin:0 0 .6rem}
    .note{font-size:.85rem;color:#666;margin-top:8px}
    .muted{color:#666;font-size:.9rem}
  </style>
</head>
<body>
  <div class="card">
    <h1>Blog Admin</h1>
    <div id="login-box">
      <label>Password</label>
      <input id="pw" type="password" placeholder="Admin password" />
      <div style="margin-top:10px"><button id="login" class="btn">Log in</button></div>
      <p class="small">This admin is intended for local use. Do not expose to public without HTTPS and stronger auth.</p>
    </div>

    <div id="app" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <button id="refresh" class="btn ghost">Refresh</button>
          <button id="logout" class="btn ghost">Logout</button>
        </div>
        <div class="small">Logged in</div>
      </div>

      <div style="margin-top:12px;display:block">
      <div class="grid-2">
        <div>
          <label>Title</label>
          <input id="title" />

          <label>Excerpt</label>
          <input id="excerpt" />

          <label>Content (use `##` for headings and `-` or `1.` for lists)</label>
          <textarea id="content" rows="10"></textarea>

          <div style="display:flex;gap:8px;margin-top:8px">
            <div style="flex:1">
              <label>Author</label>
              <input id="author" />
            </div>
            <div style="width:160px">
              <label>Date</label>
              <input id="date" type="date" />
            </div>
            <div style="width:120px">
              <label>Read time</label>
              <input id="readTime" />
            </div>
          </div>

          <label style="margin-top:8px">Category</label>
          <input id="category" />

          <label style="margin-top:8px">ID (slug, lowercase, hyphens only)</label>
          <input id="id" />

          <div style="margin-top:10px;display:flex;gap:8px">
            <button id="create" class="btn">Create</button>
            <button id="update" class="btn ghost">Update</button>
            <button id="clear" class="btn ghost">Clear</button>
          </div>
        </div>

        </div>
        <div>
          <div style="font-weight:700;margin-bottom:8px">Preview</div>
          <div id="preview" class="preview">
            <div class="muted">Live preview will appear here as you type.</div>
          </div>
          <div style="font-weight:700;margin:12px 0 8px">Posts</div>
          <div id="posts" class="list"></div>
        </div>
      </div>
      </div>
    </div>
  </div>

<script>
const base = window.location.origin;
let token = localStorage.getItem('aaf_admin_token') || null;
if (token) showApp();

async function api(path, opts={}){
  opts.headers = opts.headers || {};
  opts.headers['Content-Type'] = 'application/json';
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api'+path, opts);
  if (res.status === 401) {
    alert('Unauthorized — please log in again');
    logout();
    throw new Error('Unauthorized');
  }
  return res.json();
}

document.getElementById('login').addEventListener('click', async ()=>{
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return alert('Enter password');
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})});
    const j = await r.json();
    if (j.token) {
      token = j.token; localStorage.setItem('aaf_admin_token', token);
      showApp();
    } else {
      alert(j.error || 'Login failed');
    }
  }catch(e){console.error(e);alert('Login error')}
});

document.getElementById('logout').addEventListener('click', ()=>logout());
function logout(){ token=null; localStorage.removeItem('aaf_admin_token'); document.getElementById('app').style.display='none'; document.getElementById('login-box').style.display='block'; }

function showApp(){ document.getElementById('login-box').style.display='none'; document.getElementById('app').style.display='block'; loadPosts(); }

document.getElementById('refresh').addEventListener('click', loadPosts);

async function loadPosts(){
  try{
    const blogs = await api('/blogs');
    const c = document.getElementById('posts');
    c.innerHTML = '';
    blogs.forEach(b=>{
      const el = document.createElement('div'); el.className='post-item';
      el.innerHTML = `<div>
        <div style="font-weight:700">${b.title}</div>
        <div class="meta">${b.category} • ${b.date} • ${b.readTime}</div>
      </div>
      <div class="controls">
        <button class="btn ghost" onclick="edit('${b.id}')">Edit</button>
        <button class="btn ghost" onclick="del('${b.id}')">Delete</button>
      </div>`;
      c.appendChild(el);
    });
  } catch(e){ console.error(e); alert('Failed to load posts'); }
}

function fillForm(b){
  document.getElementById('title').value = b.title || '';
  document.getElementById('excerpt').value = b.excerpt || '';
  document.getElementById('content').value = b.content || '';
  document.getElementById('author').value = b.author || '';
  document.getElementById('date').value = b.date || '';
  document.getElementById('readTime').value = b.readTime || '';
  document.getElementById('category').value = b.category || '';
  document.getElementById('id').value = b.id || '';
}

// UX helpers
function slugify(s){
  return s.toString().toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-')
    .replace(/^-+|-+$/g,'');
}

function updatePreview(){
  const title = document.getElementById('title').value.trim();
  const author = document.getElementById('author').value.trim();
  const date = document.getElementById('date').value;
  const readTime = document.getElementById('readTime').value;
  const category = document.getElementById('category').value.trim();
  const content = document.getElementById('content').value || '';
  const preview = document.getElementById('preview');
  // simple markdown-ish renderer
  const html = content.split('\n').map(para=>{
    if (!para.trim()) return '';
    if (para.startsWith('###')) return '<h3>'+para.replace('###','').trim()+'</h3>';
    if (para.startsWith('##')) return '<h2>'+para.replace('##','').trim()+'</h2>';
    if (/^\d+\./.test(para)) return '<li>'+para.replace(/^\d+\.\s*/,'')+'</li>';
    if (para.startsWith('- ')) return '<li>'+para.replace(/^-\s*/,'')+'</li>';
    return '<p>'+para+'</p>';
  }).join('');

  // wrap list items into ul/ol if present
  let body = html;
  if (body.includes('<li>')){
    // naive: group consecutive <li> into <ul>
    body = body.replace(/(<li>[\s\S]*?<\/li>)(?=(?:\s*<li>))/g, '$1');
    body = body.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g, function(m){
      return '<ul>'+m+'</ul>';
    });
  }

  preview.innerHTML = `
    ${title?'<h2>'+title+'</h2>':''}
    <div class="muted">${category?category+' • ':''}${date?date+' • ':''}${readTime?readTime:''}</div>
    <div style="margin-top:8px">${body}</div>
  `;
}

function computeReadTime(text){
  const words = (text||'').trim().split(/\s+/).filter(Boolean).length;
  const minutes = Math.max(1, Math.ceil(words / 200));
  return minutes + ' min read';
}

// auto-slug and read time
document.getElementById('title').addEventListener('input', ()=>{
  const idEl = document.getElementById('id');
  const current = idEl.value.trim();
  const auto = slugify(document.getElementById('title').value || '');
  if (!current || current === slugify(document.getElementById('title').dataset._autofill || '')){
    idEl.value = auto;
    idEl.dataset._autofill = auto;
  }
  updatePreview();
});
document.getElementById('content').addEventListener('input', ()=>{
  const text = document.getElementById('content').value || '';
  document.getElementById('readTime').value = computeReadTime(text);
  updatePreview();
});
document.getElementById('author').addEventListener('input', updatePreview);
document.getElementById('date').addEventListener('input', updatePreview);
document.getElementById('category').addEventListener('input', updatePreview);

// set default date when showing app
function setDefaultDate(){
  const d = document.getElementById('date');
  if (!d.value) {
    const today = new Date().toISOString().slice(0,10);
    d.value = today;
  }
}

window.edit = async function(id){
  try{
    const blogs = await api('/blogs');
    const b = blogs.find(x=>x.id===id);
    if (!b) return alert('Post not found');
    fillForm(b);
    updatePreview();
  }catch(e){console.error(e)}
}

function clearForm(){ fillForm({}); setDefaultDate(); updatePreview(); }

document.getElementById('clear').addEventListener('click', () => clearForm());

document.getElementById('create').addEventListener('click', async ()=>{
  const post = gatherForm();
  if (!post.id) return alert('ID required');
  if (!post.title) return alert('Title required');
  if (!post.content) return alert('Content required');
  try{
    await api('/blogs', {method:'POST', body:JSON.stringify(post)});
    loadPosts();
    clearForm();
    alert('Post created');
  }catch(e){console.error(e); alert('Create failed: '+(e.message||''))}
});

document.getElementById('update').addEventListener('click', async ()=>{
  const post = gatherForm();
  if (!post.id) return alert('ID required');
  try{
    await api('/blogs/'+encodeURIComponent(post.id), {method:'PUT', body:JSON.stringify(post)});
    loadPosts();
    alert('Post updated');
  }catch(e){console.error(e); alert('Update failed')}
});

function gatherForm(){
  return {
    id: document.getElementById('id').value.trim(),
    title: document.getElementById('title').value.trim(),
    excerpt: document.getElementById('excerpt').value.trim(),
    content: document.getElementById('content').value,
    author: document.getElementById('author').value.trim(),
    date: document.getElementById('date').value,
    category: document.getElementById('category').value.trim(),
    readTime: document.getElementById('readTime').value.trim()
  };
}

// initialize preview and date when app is shown
const _oldShowApp = showApp;
showApp = function(){ _oldShowApp(); setDefaultDate(); updatePreview(); }

window.edit = async function(id){
  try{
    const blogs = await api('/blogs');
    const b = blogs.find(x=>x.id===id);
    if (!b) return alert('Post not found');
    fillForm(b);
  }catch(e){console.error(e)}
}

window.del = async function(id){
  if (!confirm('Delete this post?')) return;
  try{
    await api('/blogs/'+encodeURIComponent(id), {method:'DELETE'});
    loadPosts();
    clearForm();
  } catch(e){console.error(e); alert('Delete failed')}
}

function clearForm(){ fillForm({}); }

document.getElementById('clear').addEventListener('click', () => clearForm());

document.getElementById('create').addEventListener('click', async ()=>{
  const post = gatherForm();
  if (!post.id) return alert('ID required');
  try{
    await api('/blogs', {method:'POST', body:JSON.stringify(post)});
    loadPosts();
    clearForm();
  }catch(e){console.error(e); alert('Create failed')}
});

document.getElementById('update').addEventListener('click', async ()=>{
  const post = gatherForm();
  if (!post.id) return alert('ID required');
  try{
    await api('/blogs/'+encodeURIComponent(post.id), {method:'PUT', body:JSON.stringify(post)});
    loadPosts();
  }catch(e){console.error(e); alert('Update failed')}
});

function gatherForm(){
  return {
    id: document.getElementById('id').value.trim(),
    title: document.getElementById('title').value.trim(),
    excerpt: document.getElementById('excerpt').value.trim(),
    content: document.getElementById('content').value,
    author: document.getElementById('author').value.trim(),
    date: document.getElementById('date').value,
    category: document.getElementById('category').value.trim(),
    readTime: document.getElementById('readTime').value.trim()
  };
}
</script>
</body>
</html>
